<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nightshade Protocol</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #12151d; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  /* Headless test report, filled by the game itself. */
  #report { position: absolute; left: -9999px; top: 0; }
</style>
</head>
<body>
<canvas id="game" width="1280" height="720" aria-label="Nightshade Protocol: a top-down stealth game. Collect 3 intel caches and reach the exit unseen."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<pre id="report"></pre>
<script type="module">
  import { start } from './src/main.js';
  import { applyShot } from './src/shots.js';
  import { runSelfTest } from './src/selftest.js';

  const report = document.getElementById('report');
  const problems = [];
  window.addEventListener('error', (event) => {
    problems.push(`error: ${event.message}`);
    report.textContent = JSON.stringify({ errors: problems, resources: performance.getEntriesByType('resource').map((r) => r.name) });
  });
  window.addEventListener('unhandledrejection', (event) => {
    problems.push(`rejection: ${event.reason}`);
  });

  const canvas = document.getElementById('game');
  const game = start(canvas);
  const params = new URLSearchParams(window.location.search);
  if (params.has('selftest')) {
    const result = runSelfTest();
    report.textContent = JSON.stringify({
      selftest: result,
      errors: problems,
      resources: performance.getEntriesByType('resource').map((r) => r.name),
    });
  } else if (params.has('shot')) {
    applyShot(game, params);
  }
  window.__nightshade = game;
</script>
</body>
</html>
